
name: TrackView Selenium Live Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-smoke:
    name: Selenium Smoke - Windows
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run CI Smoke Test
        shell: cmd
        run: |
          "C:\Program Files\JetBrains\IntelliJ IDEA 2026.2.3\plugins\maven-plugin\lib\maven3\bin\mvn.cmd" -B -Dtest=CISmokeTest test
