
name: TrackView Windows Runner Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    name: Check Windows Runner
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check runner connection
        shell: powershell
        run: |
          Write-Host "TrackView Windows Runner is working!"
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Java version:"
          java -version
