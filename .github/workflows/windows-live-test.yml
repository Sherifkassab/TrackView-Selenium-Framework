
name: TrackView Windows Runner Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    name: Check Windows Runner
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check runner connection
        shell: cmd
        run: |
          echo TrackView Windows Runner is working!
          echo Computer: %COMPUTERNAME%
          echo Runner: %RUNNER_NAME%
          java -version
